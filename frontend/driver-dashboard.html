<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavettePro - Chauffeur</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>NavettePro</h1>
            <button class="btn-icon" onclick="logout()">Déconnexion</button>
        </header>

        <div class="dashboard">
            <div class="user-info">
                <h2>Bienvenue, <span id="driverName"></span></h2>
                <div class="route-info">
                    <p><strong>Trajet assigné:</strong> <span id="routeName"></span></p>
                </div>
            </div>

            <div class="card">
                <h3>🗺️ Itinéraire</h3>
                <div id="routeMap" class="map-container">
                    <div id="map" class="map"></div>
                </div>
                <div class="trip-status">
                    <label>Statut du trajet:</label>
                    <select id="tripStatus" onchange="updateTripStatus()">
                        <option value="NOT_STARTED">Non démarré</option>
                        <option value="IN_PROGRESS">En cours</option>
                        <option value="COMPLETED">Terminé</option>
                        <option value="CANCELLED">Annulé</option>
                    </select>
                </div>
            </div>

            <div class="card">
                <h3>📋 Liste des étudiants inscrits</h3>
                <div id="studentsList" class="students-list"></div>
            </div>

            <div class="card">
                <h3>⏰ Alerte retard</h3>
                <form id="delayForm" class="delay-form">
                    <div class="form-group">
                        <label for="delayMinutes">Retard (minutes)</label>
                        <input type="number" id="delayMinutes" name="delayMinutes" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="delayReason">Raison</label>
                        <textarea id="delayReason" name="reason" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-warning">Signaler le retard</button>
                </form>
            </div>

            <div class="card">
                <h3>📍 Mise à jour de la position GPS</h3>
                <button id="startTracking" class="btn btn-primary" onclick="startLocationTracking()">Démarrer le suivi GPS</button>
                <button id="stopTracking" class="btn btn-secondary" onclick="stopLocationTracking()" style="display: none;">Arrêter le suivi GPS</button>
                <p id="locationStatus" class="location-status"></p>
            </div>
        </div>
    </div>
    <script src="js/driver.js"></script>
</body>
</html>
